<path d="M532 507 L565 507" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<text x="56" y="562" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">Self-Attention / FFN 堆叠；视觉交叉注意力每隔一个 Block 插入。</text>
<rect x="820" y="231" width="264" height="351" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="840" y="263" font-size="20" text-anchor="start" fill="#24352d" font-weight="700">第一阶段的监督</text>
<g data-diagram-box="true">
<rect x="840" y="285" width="224" height="72" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="952.0" y="315.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">ITC：独立对齐</text>
<text x="952.0" y="339.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">Query 与文本互不可见</text>
</g>
