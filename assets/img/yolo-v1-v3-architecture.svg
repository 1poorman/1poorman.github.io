<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="735" viewBox="0 0 1120 735" role="img" aria-labelledby="title desc">
<title id="title">YOLOv1 → v3 · 从网格输出到三个预测尺度</title><desc id="desc">展示原论文的检测主路径；方框内省略重复卷积层。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286447"/></marker><marker id="aux-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865d79"/></marker></defs>
<rect width="1120" height="735" rx="18" fill="#f8f9f5"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#24352d">
<text x="36" y="45" font-size="26" text-anchor="start" fill="#24352d" font-weight="700">YOLOv1 → v3 · 从网格输出到三个预测尺度</text>
<text x="36" y="76" font-size="16" text-anchor="start" fill="#64716a" font-weight="400">展示原论文的检测主路径；方框内省略重复卷积层。</text>
<rect x="36" y="109" width="1048" height="163" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="140" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv1 · 网格联合回归</text>
<text x="56" y="254" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">同一网格共享类别预测；经典 VOC 设置的输出为 7 × 7 × 30。</text>
<g data-diagram-box="true">
<rect x="56.0" y="161" width="231.0" height="66" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="188.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">输入图像</text>
<text x="171.5" y="212.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">448 × 448</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="161" width="231.0" height="66" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="188.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">24 层卷积</text>
<text x="430.5" y="212.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">特征提取</text>
</g>
<path d="M287.0 194.0 L312.0 194.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="161" width="231.0" height="66" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="188.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">2 层全连接</text>
<text x="689.5" y="212.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">联合回归</text>
</g>
<path d="M546.0 194.0 L571.0 194.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="161" width="231.0" height="66" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="188.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">S × S × (5B + C)</text>
<text x="948.5" y="212.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">框 / 置信度 / 类别</text>
</g>
<path d="M805.0 194.0 L830.0 194.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="296" width="1048" height="165" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="327" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv2 · Anchor 与细粒度特征融合</text>
<text x="56" y="443" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">高分辨率分支经 Passthrough 重排后与深层特征拼接；输出仍为单个检测尺度。</text>
<g data-diagram-box="true">
<rect x="56.0" y="347" width="231.0" height="68" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="375.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Darknet-19</text>
<text x="171.5" y="399.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">多级卷积特征</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="347" width="231.0" height="68" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="375.0" font-size="18.0" text-anchor="middle" fill="#24352d" font-weight="700">Passthrough + Concat</text>
<text x="430.5" y="399.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">浅层细节与深层特征</text>
</g>
<path d="M287.0 381.0 L312.0 381.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="347" width="231.0" height="68" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="375.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">卷积检测头</text>
<text x="689.5" y="399.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">聚类 Anchor</text>
</g>
<path d="M546.0 381.0 L571.0 381.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="347" width="231.0" height="68" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="375.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">网格解码</text>
<text x="948.5" y="399.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">中心偏移 / Anchor 宽高</text>
</g>
<path d="M805.0 381.0 L830.0 381.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="485" width="1048" height="191" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="516" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv3 · Darknet-53 与多尺度预测</text>
<text x="56" y="658" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">深层上采样后与浅层拼接；各尺度独立输出 Anchor 框、Objectness 与类别。</text>
<g data-diagram-box="true">
<rect x="56.0" y="540" width="231.0" height="80" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="574.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Darknet-53</text>
<text x="171.5" y="598.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">残差 Backbone</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="540" width="231.0" height="80" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="574.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">深层 → 上采样融合</text>
<text x="430.5" y="598.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">与中 / 浅层特征拼接</text>
</g>
<path d="M287.0 580.0 L312.0 580.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="540" width="231.0" height="80" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="574.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">三个预测尺度</text>
<text x="689.5" y="598.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">stride 32 / 16 / 8</text>
</g>
<path d="M546.0 580.0 L571.0 580.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="540" width="231.0" height="80" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="574.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">合并候选 → NMS</text>
<text x="948.5" y="598.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">兼顾不同目标尺寸</text>
</g>
<path d="M805.0 580.0 L830.0 580.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<text x="36" y="712" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">结构按 v1 / v2 / v3 分别概括；输入尺寸与具体层数以对应论文和配置为准。</text>
</g>
</svg>
