<text x="156.0" y="688.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">扩展与聚合特征</text>
</g>
<g data-diagram-box="true">
<rect x="300" y="629" width="210" height="82" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="405.0" y="664.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">多尺度 Neck</text>
<text x="405.0" y="688.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">保持梯度路径</text>
</g>
<g data-diagram-box="true">
<rect x="568" y="621" width="250" height="72" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
