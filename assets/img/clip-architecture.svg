<rect x="494" y="130" width="162" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="575.0" y="163.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">线性投影</text>
<text x="575.0" y="187.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">L2 归一化</text>
</g>
<g data-diagram-box="true">
<rect x="690" y="130" width="126" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="753.0" y="163.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">图像向量 U</text>
<text x="753.0" y="187.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">N × d</text>
</g>
<path d="M176 169 L207 169" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460 169 L491 169" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M656 169 L687 169" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
