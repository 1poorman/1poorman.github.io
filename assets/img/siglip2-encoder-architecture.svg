<text x="183.0" y="336.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">近似保持长宽比 / Patch 预算</text>
<text x="183.0" y="360.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">二维位置插值 + Padding Mask</text>
