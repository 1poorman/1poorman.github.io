<g data-diagram-box="true">
<rect x="568" y="475" width="192" height="64" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="664.0" y="501.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">输出 Query Z</text>
<text x="664.0" y="525.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">压缩视觉信息</text>
