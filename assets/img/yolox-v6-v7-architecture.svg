<text x="693.0" y="675.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">最终检测头</text>
</g>
<g data-diagram-box="true">
<rect x="864" y="621" width="200" height="72" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="964.0" y="651.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">检测结果</text>
<text x="964.0" y="675.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">推理使用</text>
</g>
<g data-diagram-box="true">
<rect x="568" y="717" width="496" height="50" rx="10" fill="#f7edf3" stroke="#d8bdcd" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="816.0" y="748.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Auxiliary Head（部分训练配置）</text>
</g>
<path d="M256 670 L297 670" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M510 670 L540 670 L540 657 L565 657" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M818 657 L861 657" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540 670 L540 742 L565 742" fill="none" stroke="#865d79" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aux-arrow)"/>
<text x="36" y="852" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">辅助头与主头并行提供监督；主干、头部宽度和辅助连接位置应按具体模型配置核对。</text>
