<text x="405.0" y="412.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">视觉 Cross-Attention</text>
<text x="405.0" y="436.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">仅 Query 读取 H</text>
