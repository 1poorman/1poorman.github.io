<rect x="840" y="384" width="224" height="72" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="952.0" y="414.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">ITM：图文匹配</text>
<text x="952.0" y="438.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">Query 与文本双向可见</text>
</g>
<g data-diagram-box="true">
<rect x="840" y="483" width="224" height="72" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="952.0" y="513.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">ITG：条件生成</text>
<text x="952.0" y="537.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">文本读 Query 与前文</text>
</g>
<rect x="36" y="626" width="1048" height="193" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="657" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">第二阶段 · 视觉软提示连接语言模型</text>
<text x="56" y="801" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">只更新 Q-Former 与投影；冻结 LLM 仍需向前面的视觉提示传递训练梯度。</text>
<g data-diagram-box="true">
<rect x="56.0" y="683" width="179.2" height="77" rx="10" fill="#eaf0f8" stroke="#b8cadd" stroke-width="1.5"/>
