<text x="964.0" y="411.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">目标部署分支</text>
</g>
<g data-diagram-box="true">
<rect x="568" y="453" width="496" height="50" rx="10" fill="#f7edf3" stroke="#d8bdcd" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="816.0" y="484.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Anchor-based 辅助头（仅训练）</text>
</g>
<path d="M256 406 L297 406" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M510 406 L540 406 L540 393 L565 393" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M818 393 L861 393" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540 406 L540 478 L565 478" fill="none" stroke="#865d79" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aux-arrow)"/>
<rect x="36" y="571" width="1048" height="240" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="602" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv7 · 主头与辅助头</text>
<text x="56" y="793" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">Lead Head 引导标签分配；辅助头向中间特征提供训练监督。</text>
<g data-diagram-box="true">
<rect x="56" y="629" width="200" height="82" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
