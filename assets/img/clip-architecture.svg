<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">CLIP · 双编码器与双向对比学习</title><desc id="desc">以原始 ViT 图像分支为例；两种模态独立编码后进入共同空间。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286447"/></marker><marker id="aux-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865d79"/></marker></defs>
<rect width="1120" height="640" rx="18" fill="#f8f9f5"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#24352d">
<text x="36" y="45" font-size="26" text-anchor="start" fill="#24352d" font-weight="700">CLIP · 双编码器与双向对比学习</text>
<text x="36" y="76" font-size="16" text-anchor="start" fill="#64716a" font-weight="400">以原始 ViT 图像分支为例；两种模态独立编码后进入共同空间。</text>
