<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">图文向量、联合匹配与视觉语言连接的三种路线</title>
  <desc id="desc">双编码器分别计算图像和文本向量，可离线缓存后比较。BLIP 的 ITM 分支对具体图文对进行交互并输出匹配分数。BLIP-2 用 Q-Former 从冻结视觉编码器提取特征，经投影后送入冻结语言模型。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286447"/></marker></defs>
  <rect width="1120" height="660" rx="18" fill="#f8f9f5"/>
  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#24352d">
    <text x="36" y="45" font-size="25" font-weight="700">多模态表示 · 输出不同，用法也不同</text>
    <text x="36" y="74" font-size="15" fill="#64716a">区分独立嵌入、图文联合表示与语言模型输入</text>
    <g fill="#fff" stroke="#c7d2c7" stroke-width="1.5">
      <rect x="36" y="102" width="1048" height="158" rx="12"/>
      <rect x="36" y="288" width="1048" height="122" rx="12"/>
      <rect x="36" y="438" width="1048" height="178" rx="12"/>
    </g>
    <g font-size="19" font-weight="700">
      <text x="55" y="164">CLIP / SigLIP</text>
      <text x="55" y="340">BLIP · ITM</text>
      <text x="55" y="514">BLIP-2</text>
    </g>
    <g fill="#64716a" font-size="14">
      <text x="55" y="193">独立编码与检索</text>
      <text x="55" y="369">图文交互与精排</text>
      <text x="55" y="543">视觉与语言连接</text>
    </g>
    <g fill="#edf3e9" stroke="#cddcc8">
      <rect x="238" y="123" width="156" height="46" rx="7"/>
      <rect x="238" y="194" width="156" height="46" rx="7"/>
      <rect x="430" y="123" width="192" height="46" rx="7"/>
      <rect x="430" y="194" width="192" height="46" rx="7"/>
      <rect x="657" y="123" width="136" height="46" rx="7"/>
      <rect x="657" y="194" width="136" height="46" rx="7"/>
      <rect x="850" y="151" width="210" height="64" rx="7"/>
      <rect x="238" y="322" width="180" height="56" rx="7"/>
      <rect x="454" y="322" width="190" height="56" rx="7"/>
      <rect x="680" y="322" width="174" height="56" rx="7"/>
      <rect x="890" y="322" width="170" height="56" rx="7"/>
      <rect x="238" y="481" width="180" height="78" rx="7"/>
      <rect x="454" y="481" width="190" height="78" rx="7"/>
      <rect x="680" y="481" width="174" height="78" rx="7"/>
      <rect x="890" y="481" width="170" height="78" rx="7"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="316" y="153">图片库</text>
      <text x="316" y="224">文本查询</text>
      <text x="526" y="153">图像编码 + 投影</text>
      <text x="526" y="224">文本编码 + 投影</text>
      <text x="725" y="153">图像向量 u</text>
      <text x="725" y="224">文本向量 v</text>
      <text x="955" y="179" font-weight="700">向量相似度</text>
      <text x="955" y="202" font-size="13" fill="#64716a">可预计算与近邻检索</text>
      <text x="328" y="356" font-size="16">图像特征 + 文本</text>
      <text x="549" y="356">Cross-Attention</text>
      <text x="767" y="356">图文联合表示</text>
      <text x="975" y="356" font-weight="700">匹配分数</text>
      <text x="328" y="514">视觉编码器</text>
      <text x="328" y="541" font-size="13" fill="#64716a">冻结 · 读取图像</text>
      <text x="549" y="514">Q-Former</text>
      <text x="549" y="541" font-size="13" fill="#64716a">可学习 Query 提取信息</text>
      <text x="767" y="514" font-size="16">投影后的视觉 Token</text>
      <text x="767" y="541" font-size="13" fill="#64716a">语言模型的视觉提示</text>
      <text x="975" y="514">语言模型</text>
      <text x="975" y="541" font-size="13" fill="#64716a">冻结 · 条件生成</text>
    </g>
    <g fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)">
      <path d="M394 146H428"/><path d="M394 217H428"/>
      <path d="M622 146H655"/><path d="M622 217H655"/>
      <path d="M793 146H821V170H848"/><path d="M793 217H821V196H848"/>
      <path d="M418 350H452"/><path d="M644 350H678"/><path d="M854 350H888"/>
      <path d="M418 520H452"/><path d="M644 520H678"/><path d="M854 520H888"/>
    </g>
    <text x="238" y="591" font-size="14" fill="#64716a">第三行展示生成阶段；BLIP-2 的第一阶段还训练专门的图文对齐与匹配任务。</text>
    <text x="38" y="643" font-size="13" fill="#64716a">概念图：具体编码器、投影维度、Query 数与任务头随配置变化。</text>
  </g>
</svg>
