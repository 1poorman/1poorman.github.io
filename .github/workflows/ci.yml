name: Beautiful Jekyll CI
on: [push, pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: bundle install && bundle exec appraisal install
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5
      - name: Validate content metadata
        run: bundle exec ruby scripts/check-content.rb
      - name: Setup CI config
        run: |
          echo "---" > _config_ci.yml
          echo "baseurl: ${{ steps.configure-pages.outputs.base_path }}" >> _config_ci.yml
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --strict_front_matter --config _config.yml,_config_ci.yml
      - name: Validate generated navigation and metadata
        env:
          LAB_BASE_PATH: ${{ steps.configure-pages.outputs.base_path }}
        run: python3 scripts/check-output.py _site "$LAB_BASE_PATH"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
