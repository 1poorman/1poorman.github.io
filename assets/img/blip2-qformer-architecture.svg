<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="894" viewBox="0 0 1120 894" role="img" aria-labelledby="title desc">
<title id="title">BLIP-2 · Q-Former 与两阶段预训练</title><desc id="desc">蓝色为冻结模块；第一阶段学习图文表示，第二阶段连接冻结语言模型。</desc>
