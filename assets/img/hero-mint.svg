<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9d8f"/>
      <stop offset="0.55" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb703" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 柔和光斑 -->
  <circle cx="1250" cy="200" r="420" fill="url(#glow1)"/>
  <circle cx="300" cy="750" r="380" fill="url(#glow1)"/>
  <circle cx="1450" cy="700" r="300" fill="url(#glow2)"/>

  <!-- 装饰圆环与波点 -->
  <circle cx="1230" cy="230" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
  <circle cx="1230" cy="230" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="250" cy="680" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <circle cx="1380" cy="640" r="26" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="1420" cy="600" r="12" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="150" cy="220" r="18" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="190" cy="180" r="8" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="820" cy="140" r="10" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="700" cy="820" r="14" fill="#ffffff" fill-opacity="0.28"/>
  <circle cx="1050" cy="760" r="9" fill="#ffffff" fill-opacity="0.4"/>

  <!-- 底部波浪 -->
  <path d="M0,720 C260,640 520,800 800,740 C1080,680 1340,780 1600,700 L1600,900 L0,900 Z" fill="#ffffff" fill-opacity="0.10"/>
  <path d="M0,790 C300,720 560,860 860,800 C1160,740 1380,840 1600,780 L1600,900 L0,900 Z" fill="#ffffff" fill-opacity="0.14"/>
</svg>
