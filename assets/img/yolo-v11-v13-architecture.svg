<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">YOLO11 / v12 / v13 · 上下文建模模块</title><desc id="desc">共同保留多尺度预测框架，但注意力或高阶关系模块的组织不同。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286447"/></marker><marker id="aux-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865d79"/></marker></defs>
<rect width="1120" height="750" rx="18" fill="#f8f9f5"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#24352d">
<text x="36" y="45" font-size="26" text-anchor="start" fill="#24352d" font-weight="700">YOLO11 / v12 / v13 · 上下文建模模块</text>
<text x="36" y="76" font-size="16" text-anchor="start" fill="#64716a" font-weight="400">共同保留多尺度预测框架，但注意力或高阶关系模块的组织不同。</text>
<rect x="36" y="110" width="1048" height="173" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="141" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLO11 · 部分通道注意力</text>
<text x="56" y="265" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">C2PSA：通道分流 → 部分通道经过注意力 / FFN → 与旁路融合。</text>
<g data-diagram-box="true">
<rect x="56.0" y="161" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Conv + C3k2</text>
<text x="171.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">CSP 风格特征提取</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="161" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">SPPF + C2PSA</text>
<text x="430.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">深层上下文</text>
</g>
<path d="M287.0 200.0 L312.0 200.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="161" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">多尺度 C3k2 Neck</text>
<text x="689.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">上 / 下采样融合</text>
</g>
<path d="M546.0 200.0 L571.0 200.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="161" width="231.0" height="78" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">解耦检测头</text>
<text x="948.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">分类与框回归</text>
</g>
<path d="M805.0 200.0 L830.0 200.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="307" width="1048" height="173" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="338" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv12 · Area Attention 与 R-ELAN</text>
<text x="56" y="462" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">Area Attention 在区域内关联位置；R-ELAN 组织残差与层聚合。</text>
<g data-diagram-box="true">
<rect x="56.0" y="358" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="391.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">图像特征</text>
<text x="171.5" y="415.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">空间位置形成 Token</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="358" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="391.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">区域划分</text>
<text x="430.5" y="415.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">减少单层关系矩阵规模</text>
</g>
<path d="M287.0 397.0 L312.0 397.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="358" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="391.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">区域注意力 + R-ELAN</text>
<text x="689.5" y="415.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">聚合并保留梯度路径</text>
</g>
<path d="M546.0 397.0 L571.0 397.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="358" width="231.0" height="78" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="391.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">多尺度融合 / 检测头</text>
<text x="948.5" y="415.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">输出检测候选</text>
</g>
<path d="M805.0 397.0 L830.0 397.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="504" width="1048" height="185" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="535" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv13 · HyperACE 与 FullPAD</text>
<text x="56" y="671" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">FullPAD 将增强信息分发到 Backbone / Neck / Head 之间；此路线不天然去除 NMS。</text>
<g data-diagram-box="true">
<rect x="56.0" y="555" width="231.0" height="88" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="593.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">多尺度卷积特征</text>
<text x="171.5" y="617.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">含深度可分离模块</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="555" width="231.0" height="88" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="593.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">HyperACE</text>
<text x="430.5" y="617.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">节点 → 超边 → 节点</text>
</g>
<path d="M287.0 599.0 L312.0 599.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="555" width="231.0" height="88" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="593.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">FullPAD</text>
<text x="689.5" y="617.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">在多处融合与分发特征</text>
</g>
<path d="M546.0 599.0 L571.0 599.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="555" width="231.0" height="88" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="593.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">多尺度检测头</text>
<text x="948.5" y="617.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">类别与位置</text>
</g>
<path d="M805.0 599.0 L830.0 599.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<text x="36" y="727" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">各行突出关键模块及信息关系，不表示三个模型使用完全相同的 Backbone / Neck 层序。</text>
</g>
</svg>
