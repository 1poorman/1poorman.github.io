
<h2 class="sr-only">Interactive fireworks explosion canvas animation</h2>
<canvas id="c" style="display:block;width:100%;height:420px;cursor:pointer;border-radius:var(--border-radius-lg);background:#06060f"></canvas>
<p style="text-align:center;font-size:13px;color:var(--color-text-secondary);margin:8px 0 0;">Click anywhere to launch a firework</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const PALETTES = [
  ['#ff6b6b','#ffd93d','#ff9f43','#ee5a24'],
  ['#48dbfb','#00d2d3','#54a0ff','#5f27cd'],
  ['#a29bfe','#fd79a8','#fdcb6e','#e17055'],
  ['#55efc4','#00b894','#81ecec','#74b9ff'],
  ['#ff9ff3','#ffeaa7','#dfe6e9','#b2bec3'],
];

class Particle {
  constructor(x, y, vx, vy, color, life, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = size;
    this.gravity = 0.06;
    this.trail = [];
  }
  update() {
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 5) this.trail.shift();
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    for (let i = 0; i < this.trail.length; i++) {
      const a = (i / this.trail.length) * alpha * 0.4;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, this.size * (i/this.trail.length), 0, Math.PI*2);
      ctx.fillStyle = this.color + Math.floor(a*255).toString(16).padStart(2,'0');
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = this.color + Math.floor(alpha*255).toString(16).padStart(2,'0');
    ctx.fill();
  }
  isDead() { return this.life <= 0; }
}

class Rocket {
  constructor(x, targetY) {
    this.x = x;
    this.y = canvas.height;
    this.targetY = targetY;
    this.vy = -12 - Math.random() * 5;
    this.vx = (Math.random() - 0.5) * 2;
    this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    this.trail = [];
    this.exploded = false;
  }
  update() {
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 12) this.trail.shift();
    this.vy += 0.25;
    this.x += this.vx;
    this.y += this.vy;
    if (this.vy >= 0 || this.y <= this.targetY) {
      this.exploded = true;
    }
  }
  draw(ctx) {
    for (let i = 0; i < this.trail.length; i++) {
      const a = (i / this.trail.length) * 0.6;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, 2 * (i/this.trail.length), 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,240,180,${a})`;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
  explode(particles) {
    const count = 80 + Math.floor(Math.random() * 60);
    const color = this.palette[Math.floor(Math.random() * this.palette.length)];
    const color2 = this.palette[Math.floor(Math.random() * this.palette.length)];
    const type = Math.floor(Math.random() * 3);

    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      let speed, c;
      if (type === 0) {
        speed = 2 + Math.random() * 5;
        c = Math.random() < 0.5 ? color : color2;
      } else if (type === 1) {
        const r = Math.random();
        speed = r < 0.3 ? 1 + Math.random() * 2 : 3 + Math.random() * 6;
        c = r < 0.3 ? '#ffffff' : color;
      } else {
        speed = 3 + Math.random() * 4 + Math.sin(angle * 5) * 2;
        c = color;
      }
      const vx = Math.cos(angle) * speed * (0.8 + Math.random() * 0.4);
      const vy = Math.sin(angle) * speed * (0.8 + Math.random() * 0.4);
      particles.push(new Particle(this.x, this.y, vx, vy, c, 60 + Math.floor(Math.random() * 40), 1.5 + Math.random() * 2));
    }
    for (let i = 0; i < 8; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push(new Particle(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed - 2, '#ffe0a0', 90 + Math.floor(Math.random()*30), 2 + Math.random()));
    }
  }
}

const particles = [];
const rockets = [];
let autoTimer = 0;

function autoLaunch() {
  const x = canvas.width * 0.15 + Math.random() * canvas.width * 0.7;
  const targetY = canvas.height * 0.1 + Math.random() * canvas.height * 0.35;
  rockets.push(new Rocket(x, targetY));
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  rockets.push(new Rocket(mx, canvas.height * 0.1 + Math.random() * canvas.height * 0.35));
});

function loop() {
  ctx.fillStyle = 'rgba(6,6,15,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  autoTimer++;
  if (autoTimer > 60) {
    autoLaunch();
    autoTimer = -Math.floor(Math.random() * 30);
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    rockets[i].update();
    rockets[i].draw(ctx);
    if (rockets[i].exploded) {
      rockets[i].explode(particles);
      rockets.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].isDead()) particles.splice(i, 1);
  }

  requestAnimationFrame(loop);
}

autoLaunch();
loop();
</script>
