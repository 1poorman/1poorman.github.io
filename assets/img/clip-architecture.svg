<text x="335.0" y="163.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">视觉 Transformer</text>
<text x="335.0" y="187.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">Patch / 位置编码 / CLS</text>
</g>
