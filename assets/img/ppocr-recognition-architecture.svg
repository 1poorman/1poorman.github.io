<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="737" viewBox="0 0 1120 737" role="img" aria-labelledby="title desc">
<title id="title">PP-OCR 识别器 · CRNN 到 SVTR / GTC</title><desc id="desc">识别输入是裁剪校正后的文本行；高度压缩后沿宽度形成字符序列。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286447"/></marker><marker id="aux-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865d79"/></marker></defs>
<rect width="1120" height="737" rx="18" fill="#f8f9f5"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#24352d">
<text x="36" y="45" font-size="26" text-anchor="start" fill="#24352d" font-weight="700">PP-OCR 识别器 · CRNN 到 SVTR / GTC</text>
<text x="36" y="76" font-size="16" text-anchor="start" fill="#64716a" font-weight="400">识别输入是裁剪校正后的文本行；高度压缩后沿宽度形成字符序列。</text>
<rect x="36" y="110" width="1048" height="177" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="141" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">初版 / v2 · CRNN 风格识别</text>
<text x="56" y="269" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">轻量骨干由早期配置到 PP-LCNet 演进；CTC 负责不定长字符对齐。</text>
<g data-diagram-box="true">
<rect x="56.0" y="163" width="231.0" height="77" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="195.5" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">文本行图像</text>
<text x="171.5" y="219.5" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">保持字符顺序</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="163" width="231.0" height="77" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="195.5" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">轻量 CNN</text>
<text x="430.5" y="219.5" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">压缩高度 / 保留宽度</text>
</g>
<path d="M287.0 201.5 L312.0 201.5" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="163" width="231.0" height="77" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="195.5" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">BiLSTM 序列建模</text>
<text x="689.5" y="219.5" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">上下文信息</text>
</g>
<path d="M546.0 201.5 L571.0 201.5" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="163" width="231.0" height="77" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="195.5" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">字符投影 + CTC</text>
<text x="948.5" y="219.5" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">去重与删除 blank</text>
</g>
<path d="M805.0 201.5 L830.0 201.5" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="315" width="1048" height="354" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="346" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">v3 / v4 · 轻量视觉特征与引导训练</text>
<text x="56" y="651" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">v3 常见 SAR 引导分支；v4 改用 NRTR。两者均可在推理时移除辅助解码器。</text>
<g data-diagram-box="true">
<rect x="56" y="389" width="230" height="100" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.0" y="421.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">文本行 → 轻量骨干</text>
<text x="171.0" y="445.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">v3：PP-LCNet</text>
<text x="171.0" y="469.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">v4：PP-LCNetV3</text>
</g>
<g data-diagram-box="true">
<rect x="342" y="389" width="276" height="100" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="480.0" y="421.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">视觉序列特征</text>
<text x="480.0" y="445.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">SVTR / Lite-Neck 等</text>
<text x="480.0" y="469.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">局部卷积 + 上下文混合</text>
</g>
<g data-diagram-box="true">
<rect x="690" y="371" width="374" height="88" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="877.0" y="409.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">CTC 预测头</text>
<text x="877.0" y="433.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">快速字符序列输出</text>
</g>
<g data-diagram-box="true">
<rect x="690" y="510" width="374" height="94" rx="10" fill="#f7edf3" stroke="#d8bdcd" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="877.0" y="539.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">辅助 Attention 解码器</text>
<text x="877.0" y="563.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">SAR（v3）/ NRTR（v4）</text>
<text x="877.0" y="587.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">提供训练监督</text>
</g>
<path d="M286 439 L339 439" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M618 439 L653 439 L653 415 L687 415" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M653 439 L653 557 L687 557" fill="none" stroke="#865d79" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aux-arrow)"/>
<text x="56" y="575" font-size="18" text-anchor="start" fill="#24352d" font-weight="400">GTC：共享视觉特征同时接受</text>
<text x="56" y="605" font-size="18" text-anchor="start" fill="#24352d" font-weight="400">CTC 与辅助生成分支的训练信号。</text>
<text x="36" y="714" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">该图对应代表性轻量识别路线；检测器、教师模型与具体多头配置另行区分。</text>
</g>
</svg>
