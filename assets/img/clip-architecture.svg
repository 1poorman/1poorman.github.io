<text x="335.0" y="323.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">文本 Transformer</text>
<text x="335.0" y="347.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">因果注意力 / EOS 汇聚</text>
</g>
