<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="875" viewBox="0 0 1120 875" role="img" aria-labelledby="title desc">
<title id="title">YOLOX / v6 / v7 · 预测解耦与训练分支</title><desc id="desc">三条独立研究路线；紫色虚线表示训练辅助路径。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286447"/></marker><marker id="aux-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#865d79"/></marker></defs>
<rect width="1120" height="875" rx="18" fill="#f8f9f5"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#24352d">
<text x="36" y="45" font-size="26" text-anchor="start" fill="#24352d" font-weight="700">YOLOX / v6 / v7 · 预测解耦与训练分支</text>
<text x="36" y="76" font-size="16" text-anchor="start" fill="#64716a" font-weight="400">三条独立研究路线；紫色虚线表示训练辅助路径。</text>
<rect x="36" y="109" width="1048" height="174" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="140" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOX · 解耦检测头</text>
<text x="56" y="265" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">每个尺度共享输入特征，再分为分类与回归路线；Objectness 与框回归侧关联。</text>
<g data-diagram-box="true">
<rect x="56.0" y="161" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="171.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">CSPDarknet + PAFPN</text>
<text x="171.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">融合多尺度特征</text>
</g>
<g data-diagram-box="true">
<rect x="315.0" y="161" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="430.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">1 × 1 Stem</text>
<text x="430.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">各尺度调整通道</text>
</g>
<path d="M287.0 200.0 L312.0 200.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="574.0" y="161" width="231.0" height="78" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="689.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">分类 / 回归两支</text>
<text x="689.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">类别；框 + Objectness</text>
</g>
<path d="M546.0 200.0 L571.0 200.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<g data-diagram-box="true">
<rect x="833.0" y="161" width="231.0" height="78" rx="10" fill="#fff4db" stroke="#dfc78d" stroke-width="1.5"/>
<text x="948.5" y="194.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Anchor-free 解码</text>
<text x="948.5" y="218.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">训练用 SimOTA 分配</text>
</g>
<path d="M805.0 200.0 L830.0 200.0" fill="none" stroke="#286447" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="307" width="1048" height="240" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="338" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">YOLOv6 · 高效部署结构</text>
<text x="56" y="529" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">训练时 Rep 模块多分支、部署时融合；锚框辅助训练用于后续版本的相应配置。</text>
<g data-diagram-box="true">
<rect x="56" y="365" width="200" height="82" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="156.0" y="400.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">EfficientRep</text>
<text x="156.0" y="424.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">Rep 类卷积模块</text>
</g>
<g data-diagram-box="true">
<rect x="300" y="365" width="210" height="82" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="405.0" y="400.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">Rep-PAN</text>
<text x="405.0" y="424.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">多尺度融合</text>
</g>
<g data-diagram-box="true">
<rect x="568" y="357" width="250" height="72" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
<text x="693.0" y="387.0" font-size="19" text-anchor="middle" fill="#24352d" font-weight="700">高效解耦头</text>
<text x="693.0" y="411.0" font-size="15" text-anchor="middle" fill="#586b60" font-weight="400">分类与定位</text>
</g>
<g data-diagram-box="true">
<rect x="864" y="357" width="200" height="72" rx="10" fill="#edf3e9" stroke="#bfd1bd" stroke-width="1.5"/>
