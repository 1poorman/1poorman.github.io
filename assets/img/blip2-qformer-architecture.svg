<rect width="1120" height="894" rx="18" fill="#f8f9f5"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#24352d">
<text x="36" y="45" font-size="26" text-anchor="start" fill="#24352d" font-weight="700">BLIP-2 · Q-Former 与两阶段预训练</text>
<text x="36" y="76" font-size="16" text-anchor="start" fill="#64716a" font-weight="400">蓝色为冻结模块；第一阶段学习图文表示，第二阶段连接冻结语言模型。</text>
<g data-diagram-box="true">
