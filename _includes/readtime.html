<!--- 阅读时长估算：按字符数计算（中文约 400 字/分钟） --->

{% assign read_chars = page.content | strip_html | size %}
{% assign read_mins = read_chars | divided_by: 400 %}
{% if read_mins >= 1 %}
  <span class="post-meta"><span class="d-none d-md-inline middot">&middot;</span> <i class="far fa-clock"></i> 约 {{ read_mins }} 分钟读完</span>
{% else %}
  <span class="post-meta"><span class="d-none d-md-inline middot">&middot;</span> <i class="far fa-clock"></i> 不到 1 分钟读完</span>
{% endif %}
