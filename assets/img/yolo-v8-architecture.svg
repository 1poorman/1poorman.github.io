<rect x="36" y="554" width="1048" height="117" rx="10" fill="#ffffff" stroke="#c7d2c7" stroke-width="1.5"/>
<text x="56" y="585" font-size="21" text-anchor="start" fill="#24352d" font-weight="700">仅训练：TAL 分配正样本，分类 BCE + IoU 类损失 + DFL</text>
<text x="56" y="653" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">推理：将各尺度的类别与框合并，按阈值筛选，再执行相应 NMS。</text>
<text x="36" y="711" font-size="15" text-anchor="start" fill="#64716a" font-weight="400">DFL 约束四条边的分布，IoU 类损失约束整体框；层宽、reg_max 与任务配置应单独核对。</text>
</g>
