<header class="lab-header" data-lab-header>
  <nav class="lab-nav lab-container" aria-label="主导航">
    <a class="lab-brand" href="{{ '/' | relative_url }}" aria-label="HuaC Lab 首页"><span class="lab-brand-mark" aria-hidden="true">h<span>.</span></span><span class="lab-brand-name">HuaC <span>Lab</span></span></a>
    <div class="lab-nav-links" id="lab-navigation">
      {% for link in site.navbar-links %}<a href="{{ link[1] | relative_url }}"{% if page.nav_section == link[0] %} aria-current="page"{% endif %}>{{ link[0] }}</a>{% endfor %}
    </div>
    <div class="lab-nav-tools">
      <a class="lab-search-link" href="{{ '/archive' | relative_url }}#article-query" aria-label="查找文章">{% include lab-icon.html name='search' size=18 %}<span>搜索</span></a>
      <span class="lab-nav-divider" aria-hidden="true"></span>
      <button class="lab-icon-button lab-theme-toggle" type="button" data-theme-toggle aria-label="切换明暗主题" hidden><span class="lab-theme-moon">{% include lab-icon.html name='moon' size=19 %}</span><span class="lab-theme-sun">{% include lab-icon.html name='sun' size=19 %}</span></button>
      <button class="lab-icon-button lab-menu-toggle" type="button" data-nav-toggle aria-controls="lab-navigation" aria-expanded="false" aria-label="展开导航" hidden><span class="lab-menu-open">{% include lab-icon.html name='menu' %}</span><span class="lab-menu-close">{% include lab-icon.html name='close' %}</span></button>
    </div>
  </nav>
</header>
