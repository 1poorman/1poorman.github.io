<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">中频炉预警：业务职责与分层研判</title>
  <desc id="desc">数据管理、预警分析、故障处置与反馈归档顺序协作。预警分析包含 L1 规则、L2 时序模型和 L3 根因诊断。输出经结构化及一致性检查，按条件展示、升级或转人工。反馈用于后续复核与数据准备，不代表自动训练上线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64807e"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #193b40; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 20px; }
      .note { font-size: 18px; fill: #506c72; }
      .path { fill: none; stroke: #64807e; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="680" rx="20" fill="#f1f7f6"/>
  <text x="44" y="54" class="heading">从观测到诊断，再到可回溯的反馈</text>
  <text x="44" y="87" class="note">四个业务模块组织工作流，L1 / L2 / L3 划分分析任务</text>

  <rect x="44" y="116" width="232" height="120" rx="14" fill="#fff" stroke="#c5d9d5"/>
  <text x="66" y="153" class="label">① 数据管理</text>
  <text x="66" y="186" class="body">对齐、清洗、规整</text>
  <text x="66" y="213" class="note">读数 + 质量报告</text>
  <path d="M 279 176 H 298" class="path"/>

  <rect x="304" y="116" width="232" height="120" rx="14" fill="#dff0ec" stroke="#3b8b7c" stroke-width="2"/>
  <text x="326" y="153" class="label">② 预警分析</text>
  <text x="326" y="186" class="body">规则、趋势、诊断</text>
  <text x="326" y="213" class="note">根因 + 证据 + 建议</text>
  <path d="M 539 176 H 558" class="path"/>

  <rect x="564" y="116" width="232" height="120" rx="14" fill="#fff" stroke="#c5d9d5"/>
  <text x="586" y="153" class="label">③ 故障处置</text>
  <text x="586" y="186" class="body">工单、步骤与备件</text>
  <text x="586" y="213" class="note">分级通知与应急条目</text>
  <path d="M 799 176 H 818" class="path"/>

  <rect x="824" y="116" width="232" height="120" rx="14" fill="#fff" stroke="#c5d9d5"/>
  <text x="846" y="153" class="label">④ 反馈归档</text>
  <text x="846" y="186" class="body">输入、输出与真值</text>
  <text x="846" y="213" class="note">供后续复核与数据准备</text>
  <path d="M 420 239 V 269" class="path"/>

  <rect x="44" y="276" width="1012" height="332" rx="16" fill="#fff" stroke="#b9d3cc"/>
  <text x="72" y="315" class="label">展开预警分析：三个层次，三种问题</text>
  <rect x="72" y="340" width="300" height="124" rx="12" fill="#eef5f1"/>
  <text x="92" y="373" class="label">L1 · 当前是否越限？</text>
  <text x="92" y="407" class="body">阈值、组合与工况规则</text>
  <text x="92" y="439" class="note">提供即时、明确的触发条件</text>
  <path d="M 378 403 H 394" class="path"/>

  <rect x="400" y="340" width="300" height="124" rx="12" fill="#eaf3fa"/>
  <text x="420" y="373" class="label">L2 · 异常与越限趋势</text>
  <text x="420" y="407" class="body">联合异常与趋势预测</text>
  <text x="420" y="439" class="note">补充时序变化，按任务选模型</text>
  <path d="M 706 403 H 722" class="path"/>

  <rect x="728" y="340" width="300" height="124" rx="12" fill="#f9f1e6"/>
  <text x="748" y="373" class="label">L3 · 证据能支持什么？</text>
  <text x="748" y="407" class="body">图谱、统计、上下文 + LLM</text>
  <text x="748" y="439" class="note">组织根因解释与处置建议</text>
  <path d="M 878 468 V 496" class="path"/>

  <rect x="72" y="504" width="956" height="78" rx="12" fill="#f4f7f8" stroke="#d4e1e2"/>
  <text x="94" y="535" class="body">输出检查：JSON · 数值 / 物理一致性 · 图谱关系 · 统计候选</text>
  <text x="94" y="564" class="note">按条件展示、升级兜底或转人工；模型自报置信度不参与级联升级</text>
  <text x="44" y="643" class="note">当前边界：通知为模拟通道；八类后训练模型仅离线比较，尚未接入在线诊断。</text>
</svg>
